<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BEATLY</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#08070d;--panel:#14111e;--purple:#a855f7;--muted:#aaa2ba;--white:#f8f7fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#241039 0%,#0b0912 42%,var(--bg) 80%);color:var(--white);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:720px;margin:auto;padding:24px 16px 36px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand{font-size:27px;font-weight:900;letter-spacing:3px}.brand span{color:#c084fc}.pill{border:1px solid #56317a;background:#1c112b;border-radius:99px;padding:8px 12px;color:#d8b4fe;font-size:12px}.hero{padding:22px;border:1px solid #3c2454;background:linear-gradient(135deg,rgba(124,58,237,.22),rgba(20,17,30,.9));border-radius:24px;box-shadow:0 12px 50px #6d28d922;margin-bottom:22px}.eyebrow{color:#c084fc;text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800}.hero h1{font-size:29px;line-height:1.1;margin:10px 0}.hero p{color:var(--muted);font-size:14px;margin:0 0 18px}.search{display:flex;gap:8px}.search input{min-width:0;flex:1;background:#0d0b14;border:1px solid #42334f;border-radius:14px;padding:14px;color:white;font-size:15px;outline:none}.search input:focus{border-color:var(--purple)}button{border:0;border-radius:14px;padding:13px 16px;background:linear-gradient(135deg,#a855f7,#6d28d9);color:white;font-weight:800;cursor:pointer}.section-head{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 12px}.section-head h2{font-size:17px;margin:0}.hint{font-size:12px;color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:linear-gradient(145deg,#1b1527,#100e17);border:1px solid #2c2239;border-radius:18px;padding:16px;min-height:106px;text-align:left}.tile .emoji{font-size:25px;display:block;margin-bottom:10px}.tile b{display:block;font-size:14px}.tile small{display:block;color:var(--muted);margin-top:5px}.status{margin-top:16px;padding:13px 15px;border-radius:14px;background:#100e18;color:var(--muted);font-size:13px;border:1px solid #282132}.status strong{color:#d8b4fe}.footer{text-align:center;color:#6f657e;font-size:11px;margin-top:24px}@media(min-width:560px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.hero h1{font-size:36px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">BEAT<span>LY</span></div><div class="pill">MUSIC SPACE</div></header><section class="hero"><div class="eyebrow">Your sound. Your space.</div><h1>Музыка ближе.<br>Настроение громче.</h1><p>Твоя музыкальная территория в Telegram.</p><form class="search" id="searchForm"><input id="query" placeholder="Название трека или артист" autocomplete="off"><button type="submit">Найти</button></form></section><div class="section-head"><h2>Твоя библиотека</h2><span class="hint">BEATLY</span></div><div class="tiles"><button class="tile" data-action="search"><span class="emoji">⌕</span><b>Поиск музыки</b><small>Найти трек или артиста</small></button><button class="tile" data-action="favorites"><span class="emoji">♡</span><b>Избранное</b><small>Любимые треки</small></button><button class="tile" data-action="playlists"><span class="emoji">♫</span><b>Плейлисты</b><small>Твои подборки</small></button><button class="tile" data-action="premium"><span class="emoji">✦</span><b>Premium</b><small>Больше возможностей</small></button></div><div class="status" id="status"><strong>Добро пожаловать в BEATLY.</strong> Это первая версия интерфейса. Поиск и библиотека подключаются следующим этапом.</div><div class="footer">BEATLY • слушай. сохраняй. живи музыкой.</div></div><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#08070d');tg.setBackgroundColor('#08070d')}catch(e){}}
const box=document.getElementById('status');function show(t){box.textContent=t}
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();const q=document.getElementById('query').value.trim();show(q?'Поиск «'+q+'» подключим на следующем этапе.':'Введи название трека или исполнителя.')});
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const m={search:'Введи название трека или исполнителя в строку поиска выше.',favorites:'Раздел избранного появится после подключения базы данных.',playlists:'Создание плейлистов добавим следующим этапом.',premium:'Раздел Premium пока в разработке.'};show(m[b.dataset.action]||'Скоро здесь появятся новые функции.')}));
</script></body></html>
